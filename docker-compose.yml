services:
  tripcraft:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tripcraft-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    restart: unless-stopped
